version: '3.8'

services:
  caugu:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: caugu-ai
    environment:
      - DATABASE_URL=postgresql://caugu:caugu_password@db:5432/caugu
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
      - ./cache:/app/cache
    depends_on:
      - db
    networks:
      - caugu-network

  db:
    image: postgres:15-alpine
    container_name: caugu-db
    environment:
      - POSTGRES_USER=caugu
      - POSTGRES_PASSWORD=caugu_password
      - POSTGRES_DB=caugu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - caugu-network

volumes:
  postgres_data:

networks:
  caugu-network:
    driver: bridge
